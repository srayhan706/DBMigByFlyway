spring.application.name=DBMigCrud

# Load DB credentials from the .env file in the project root.
# Real environment variables with the same names override the file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate never creates or alters tables, it only checks the entities match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
